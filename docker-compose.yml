services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: afisha
      POSTGRES_USER: afisha
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres:/var/lib/postgresql
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U afisha -d afisha"]
      interval: 3s
      timeout: 3s
      retries: 15
  api:
    build:
      context: .
      target: api
    ports:
      - "127.0.0.1:${API_PORT:-3001}:3001"
    environment:
      API_PORT: 3001
      HOST: 0.0.0.0
      REFRESH_INTERVAL_MINUTES: ${REFRESH_INTERVAL_MINUTES:-360}
      BOOTSTRAP_CATALOG: ${BOOTSTRAP_CATALOG:-1}
      PGHOST: db
      PGPORT: 5432
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      WEB_PORT: ${WEB_PORT:-3000}
      PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-}
      TELEGRAM_CLIENT_ID: ${TELEGRAM_CLIENT_ID:-}
      TELEGRAM_CLIENT_SECRET: ${TELEGRAM_CLIENT_SECRET:-}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      BOT_API_TOKEN: ${BOT_API_TOKEN:-}
      TIMEPAD_TOKEN: ${TIMEPAD_TOKEN:-}
      ROUTING_ORIGIN: ${ROUTING_ORIGIN:-}
      YANDEX_MAPS_JS_API_KEY: ${YANDEX_MAPS_JS_API_KEY:-}
      TIMEWEB_API_KEY: ${TIMEWEB_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      BASE_URL: ${BASE_URL:-https://api.timeweb.ai/v1}
      DISCOVERY_MODEL: ${DISCOVERY_MODEL:-}
      DISCOVERY_MODEL_KEY: ${DISCOVERY_MODEL_KEY:-}
      DISCOVERY_MODEL_BASE: ${DISCOVERY_MODEL_BASE:-https://api.openai.com/v1}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 15
  web:
    build:
      context: .
      target: web
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:80"
    depends_on:
      api:
        condition: service_healthy
  bot:
    profiles: [telegram]
    build:
      context: .
      target: bot
    environment:
      API_ORIGIN: http://api:3001
      BOT_TOKEN: ${BOT_TOKEN:-}
      BOT_API_TOKEN: ${BOT_API_TOKEN:-}
      PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-}
    depends_on: [api]
volumes:
  postgres:
